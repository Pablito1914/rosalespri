name: Keep Streamlit App Awake

on:
  schedule:
    # Ejecuta cada 25 minutos para mantener el contenedor activo
    - cron: '*/25 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Direct Streamlit Endpoints
        run: |
          curl -s -L -b cookies.txt -c cookies.txt -A "Mozilla/5.0" https://rosalesv1.streamlit.app/~/+/_stcore/health || true
          curl -s -L -b cookies.txt -c cookies.txt -A "Mozilla/5.0" https://rosalesv1.streamlit.app/~/+/ > /dev/null || true
